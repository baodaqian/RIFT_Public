# Portable RIFT environment for Linux x86_64 / NCSA Delta A100 (2026-09-19).
# From the repository root: conda env create -f requirements.yaml
# Then: conda activate RIFT
# Audited effective imports, including PACE user-site packages; not a blind
# conda export and not a complete lock of all transitive dependencies.
#
# REQUIRED SECOND STEP for Radar Fields: build tinycudann 2.0 from
# https://github.com/NVlabs/tiny-cuda-nn at
# 749dd70c5afc5a9dadb85e5652ed65d55e0ba187, bindings/torch, after Torch exists.
# Use TCNN_CUDA_ARCHITECTURES=80 and --no-build-isolation --no-deps.
# It is not a portable PyPI dependency or a transferable PACE binary.
# RadarSplat likewise needs its pinned source/GLM and fused-SSIM CUDA build.
# Full commands and qualifications: NCSA_Delta_Production_Handoff.md, section 2.
# torchkbnufft belonged to the retired Cartesian/Stolt prototype. The current
# range forward/adjoint operators use pure torch Gaussian gridding + torch.fft;
# their forward/gradient/adjoint gates pass with torchkbnufft imports blocked.
name: RIFT
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10.16
  - pip=25.0
  - setuptools=75.8.0
  - wheel=0.45.1
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0+cu124
      - torchvision==0.21.0+cu124
      - torchaudio==2.6.0+cu124
      - numpy==1.26.0
      - scipy==1.15.2
      - matplotlib==3.10.1
      - wandb==0.25.1
      - open3d==0.19.0
      - plyfile==1.1
      - tqdm==4.67.1
      - pandas==2.3.1
      - scikit-image==0.25.2
      - seaborn==0.13.2
      - configargparse==1.7.1
      - PyYAML==6.0.3
      - imageio==2.37.0
      - pillow==11.1.0
      - ninja==1.11.1.3
      - rich==13.9.4
      # Declared upstream RadarSplat dependency, absent on the PACE test host.
      - jaxtyping
      # Tests used this version in /tmp; it was not installed in the shared env.
      - pytest==9.1.1
variables:
  # Avoid silently importing unrelated ~/.local packages on the destination.
  PYTHONNOUSERSITE: '1'
  MPLBACKEND: Agg
